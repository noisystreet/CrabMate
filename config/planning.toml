# 规划 / 反思 / 编排模式嵌入默认（reflection、终答规划、planner/executor 等）。
# 与 `config/default_config.toml`、`config/session.toml`、`config/context_inject.toml`、`config/tools.toml`、`config/sandbox.toml` 在 `load_config` 中顺序合并（本文件在其后，再后为 **`config/memory.toml`**），再被 config.toml / .agent_demo.toml 与 CM_* 覆盖。

[agent]

reflection_default_max_rounds = 5
final_plan_requirement = "workflow_reflection"
plan_rewrite_max_attempts = 2
final_plan_require_strict_workflow_node_coverage = false
final_plan_semantic_check_enabled = false
final_plan_semantic_check_max_non_readonly_tools = 0
final_plan_semantic_check_max_tokens = 256

# 完成判定第 ② 层（LLM 语义判定，见 docs/design/completion_judge.md）。
# 默认**开**（#1415）：第 ① 层与 C++ 领域检测器已删除，本开关是早停的**唯一判定源**。
# 关掉 = 任何任务都不早停（回合跑到迭代上限）；缺 API_KEY 或判定失败同理。
# 成本有界：每回合 ≤3 次调用、证据指纹去重、max_tokens 512、fail-open（判定失败绝不早停）。
completion_judge_enabled = true
completion_judge_max_tokens = 512
# 空 = 走默认模型；不强制与执行模型分离（单模型部署须可用）。
completion_judge_model = ""

# 回合起点「本轮是否只读」的语义判定（#1401 #12，见 docs/配置说明.md）。
# 默认**开**：它替代了原先 `at_turn_start` 的关键词启发式（三组子串表已整段删除）。
# 每个 **Act** 回合起点发一次无工具短请求；判为只读则整轮收窄为 `review_readonly`
# （工具表过滤 + 执行期 early-deny）。Ask/Plan 跳过（只读由 session_mode 挂载）。
# 成本：每回合多**一次**调用（`max_tokens` 512）；**不**计入 `turn_budget` 与 `/usage` 汇总。
# fail-open：关掉 / 调用失败 / 被取消 / 答复解析不出布尔 → 不挂约束（= 无回合级约束）。
# 与 `completion_judge_enabled` 刻意分开：不同消费者，关它不影响本键。
turn_execution_constraint_judge_enabled = true

# 子 Agent 委托（#839 P1，见 docs/design/subagent_delegation.md）。
# 默认关：关 = `delegate_task` 不注入给模型（不是「注入后拒绝」）。
# 子任务只用只读工具子集，权限取父的 min 链结果，故本开关不改变任何权限面。
subagent_enabled = false
# 递归深度上限。**当前只接受 1**（1 = 禁止嵌套）：首版派生子任务时会显式排除
# delegate_task，嵌套不可能发生；配 > 1 会在启动时报错而不是静默无效。
subagent_max_depth = 1
subagent_max_llm_calls = 8
subagent_max_wall_secs = 300
# 回传正文长度上限（字符）；0 = 不截断。
subagent_max_report_chars = 4000

# L2 跨回合任务状态（#1386 S2 / #1455 A 步，见 docs/design/agent_autonomy_enhancement.md §4）。
# 默认关。开启后**仅在回合因预算耗尽而中止时**把进度写成
# `<工作区>/.crabmate/tasks/<conversation>.json`（`status = "paused"`）。
# 本步不含续跑：没有任何代码据此发起新回合，因此**不产生额外 LLM 调用、也不扩大操作面**。
# 落盘内容只有目标摘要、证据 id/工具名/成败/退出码与预算快照——**不含工具原始输出**。
autonomy_enabled = false
# `.crabmate/tasks/` 保留文件数上限；0 = 不按数量清理。
autonomy_max_tasks = 200
# 任务状态文件存活秒数（默认 7 天）；0 = 不按时间清理。
autonomy_task_ttl_secs = 604800
# 跨回合累计三项上限（#1455 B 步）。**软闸**：真源是可手删的状态文件，删掉即清零，
# 因此它只能防「意外跑飞」，防不住「故意绕过」。0 = 不限制（默认）。
# 与上面的单轮上限并存：单轮限制仍由 [agent] 的 max_turn_* 管，两者不互相改写语义。
autonomy_max_cumulative_llm_calls = 0
autonomy_max_cumulative_tokens = 0
autonomy_max_cumulative_secs = 0
# 自动续跑（#1455 C 步）。与 autonomy_enabled 分两层：enabled 只落盘+注入+累计（只读），
# auto_resume 才会「失败后自己再起一个回合」（烧钱、会动文件）。默认关。
autonomy_auto_resume = false
# 单会话自动续跑轮数上限（**硬闸**，进程内计数）。0 = 不限制。
autonomy_max_autonomous_turns = 0
# 遇「待审批」暂停时停止自动续跑（默认停：等人是安全边界）。
autonomy_stop_on_approval_required = true

# 意图路由配置键已全部移除；deny_unknown_fields 会拒绝：intent_at_turn_start_enabled、
# intent_l2_*、intent_execute_*_threshold、intent_non_hier_execute_*_threshold、
# intent_l0_routing_boost_enabled、intent_mode_bias_enabled；CM_INTENT_AT_TURN_START_ENABLED 亦已移除。
# planner_executor_mode：运行模式已固定为 single_agent（ReAct）；键与 CM_PLANNER_EXECUTOR_MODE 已移除。
# final_plan_semantic_check_accept_legacy_text 与 CM_FINAL_PLAN_SEMANTIC_CHECK_ACCEPT_LEGACY_TEXT 已移除（侧向模型仅接受 JSON）。

