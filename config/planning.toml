# 规划 / 反思 / 编排模式嵌入默认（reflection、终答规划、planner/executor 等）。
# 与 `config/default_config.toml`、`config/session.toml`、`config/context_inject.toml`、`config/tools.toml`、`config/sandbox.toml` 在 `load_config` 中顺序合并（本文件在其后，再后为 **`config/memory.toml`**），再被 config.toml / .agent_demo.toml 与 CM_* 覆盖。

[agent]

reflection_default_max_rounds = 5
final_plan_requirement = "workflow_reflection"
plan_rewrite_max_attempts = 2
final_plan_require_strict_workflow_node_coverage = false
final_plan_semantic_check_enabled = false
# 侧向模型默认仅收 JSON；true 时额外接受旧式单行 CONSISTENT/INCONSISTENT（CM_FINAL_PLAN_SEMANTIC_CHECK_ACCEPT_LEGACY_TEXT）
final_plan_semantic_check_accept_legacy_text = false
final_plan_semantic_check_max_non_readonly_tools = 0
final_plan_semantic_check_max_tokens = 256
planner_executor_mode = "single_agent"

# 意图管线（L2 额外 chat：**默认关**，退役中；仅显式 intent_l2_enabled=true 且门控开且 session_mode=act 时调用；
# 输出 suggested_mode + confidence，不自动改用户 mode；不可用/低置信 fail-open；见配置说明）
# intent_l2_enabled = false
# intent_l2_min_confidence = 0.7   # 低于该值不采纳 L2，改为 fail-open（仍可带 suggested_mode）
# intent_l0_routing_boost_enabled / intent_execute_*_threshold：历史键，已无决策作用
# planner_executor_mode：仅 single_agent（ReAct）；logical_dual_agent / hierarchical 已移除。
