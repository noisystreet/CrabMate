# 首轮上下文注入嵌入默认：工作区备忘文件、活文档摘要、依赖摘要（各入口共用）。
# 项目画像**不进首轮注入**：`project_profile_inject_*` 现仅控制 `GET /workspace/profile`（Web 侧栏）是否生成与正文上限。
# 与 `config/default_config.toml`、`config/session.toml` 在 `load_config` 中顺序合并（本文件在 session 之后、**`config/tools.toml`** 之前），再被 config.toml / .agent_demo.toml 与 CM_MEMORY_FILE_*、CM_PROJECT_PROFILE_*、CM_PROJECT_DEPENDENCY_BRIEF_* 等覆盖。

[agent]

agent_memory_file_enabled = false
agent_memory_file = ".crabmate/agent_memory.md"
agent_memory_file_max_chars = 8000
# 首轮在备忘之前注入 `.crabmate/living_docs/` 下 SUMMARY.md、map.md 等摘要（0 关闭总预算）。CM_LIVING_DOCS_*
# 无 `.crabmate/living_docs/` 下有效 Markdown 时不写入；有关闭需求可设 false。CM_LIVING_DOCS_INJECT_ENABLED
living_docs_inject_enabled = true
living_docs_relative_dir = ".crabmate/living_docs"
living_docs_inject_max_chars = 4000
living_docs_file_max_each_chars = 1200
project_profile_inject_enabled = true
project_profile_inject_max_chars = 6000
project_dependency_brief_inject_enabled = true
project_dependency_brief_inject_max_chars = 4000
# 首轮注入**运行时环境快照**（OS/arch、会话工作区根、cwd、rustc/cargo 版本、日期、权限等级）——
# 让模型不必先调 `diagnostic_summary` 才知道自己在什么环境里（#1526 A1a）。
# `max_chars = 0` 关闭；`probe_cache_ttl_secs = 0` 表示不缓存外部探测结果。CM_RUNTIME_ENV_SNAPSHOT_*
runtime_env_snapshot_enabled = true
runtime_env_snapshot_max_chars = 2000
runtime_env_snapshot_probe_cache_ttl_secs = 300
