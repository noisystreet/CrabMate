# https://pre-commit.com
# 安装：pip install pre-commit && pre-commit install
#   （本配置含 default_install_hook_types，会同时安装 pre-commit + commit-msg；旧环境可补：pre-commit install --hook-type commit-msg）
# 手动跑检查：pre-commit run --all-files（不含 commit-msg；说明校验见 conventional-commits 规则中的手动命令）。workspace clippy 为全量，不依赖暂存区。
# 业务 UI wasm/clippy：Client 仓 crabmate-client（路径 A Phase 4.2）。
default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (workspace)
        entry: cargo fmt --all --
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-clippy
        name: cargo clippy (-D warnings)
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # feature 组合门控：`cm_types` 受 `protocol` 门控、`cm_tools` / `cm_agent` 属 `server`，
      # 默认 feature 的 clippy 看不到 `--no-default-features` 下的漏门控（#1238 收尾时
      # `test_fixtures.rs` 引用 `cm_types` 就长期无人发现）。`--all-targets` 必须带：
      # 该文件只在测试目标里编译。增量约 1s，冷启动需整树重建。
      - id: cargo-check-no-default-features
        name: cargo check (--no-default-features, feature gating)
        entry: cargo check --no-default-features --all-targets
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|src/.*\.rs)$
        stages: [pre-commit]
      # 生产路径 unwrap/expect 只许降不许升（#1152）。口径是
      # `cargo clippy --lib --all-features -- -W clippy::unwrap_used
      # -W clippy::expect_used`：`--lib` 不含 test cfg，所以 `#[cfg(test)]` 的
      # 2500+ 处不会算进来。**不要改用静态扫描**——本仓库重度 `cfg(feature)`，
      # 扫描分不清「被 feature 关掉的模块」与「测试代码」，实测差 3 处。
      # 基线里记了 rustc 版本：升级工具链后数字整体漂移属正常，用
      # `python3 scripts/unwrap_ratchet.py --print-baseline` 重新生成并在 PR 说明。
      - id: unwrap-ratchet
        name: production unwrap/expect ratchet (never increase, #1152)
        entry: bash scripts/unwrap-ratchet.sh
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|src/.*\.rs|scripts/unwrap_baseline\.txt)$
        stages: [pre-commit]
      # `-D warnings` 抓不到被 `allow` 压住的告警——#1229 的根因正是 `lib_server.rs` 给
      # 10 个 `cm_*` 模块整体加了 `#[allow(unused)]`（`unused` 含 `dead_code`），死代码
      # 于是长期隐身，clippy 一直绿。所以「allow 出现在哪一层」单独门禁：模块级罩子
      # 冻结在基线、只许降不许升；item 级 `#[allow(dead_code)] // 理由` 与
      # `#[cfg_attr(not(feature = …), allow(dead_code))]` 是认可的写法，不算例外。
      # 纯 markdown / CHANGELOG 提交不涉及 `src/`，故用 `files: \.rs$`。
      - id: allow-exception-ratchet
        name: allow exceptions (no new module-level allow(unused*), #1231)
        entry: bash scripts/allow-exception-ratchet.sh
        language: system
        pass_filenames: false
        files: \.rs$
        stages: [pre-commit]
      # S4 验收口径（#1300）：上层对 `cm_internal` 的引用面只许降不许升。
      # 两个名单都从源码**派生**（`cm_internal/mod.rs` 的 `pub mod`、`lib_server.rs`
      # 的 re-export），不手工维护 —— 手工名单在 P1b 上把已迁出的 `mcp` 仍算作
      # 耦合，C2 为此虚涨 15，差点被当成回归去「修」。
      # 基线见 `scripts/cm_internal_refs_baseline.txt`；搬家使数字下降后，用
      # `bash scripts/check-cm-internal-refs.sh --print-baseline` 下调锁住收益。
      - id: cm-internal-refs
        name: cm_internal reference surface (S4 口径, #1300)
        entry: bash scripts/check-cm-internal-refs.sh --check
        language: system
        pass_filenames: false
        files: \.rs$
        stages: [pre-commit]
      # rustdoc 断链（`crate::…` 路径写错、链接到私有项）不会让 `cargo doc` 非 0 退出，
      # 所以必须 `-D warnings` 才拦得住；`--no-deps` 只检查本 crate。
      # `files: \.rs$` 而非 `always_run`：rustdoc 是 crate 级检查，只在 Rust 源码变动时才值得跑
      # （约 9s；markdown/CHANGELOG 提交不白跑）。
      - id: cargo-doc
        name: cargo doc (rustdoc warnings denied)
        entry: bash -c 'RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps'
        language: system
        pass_filenames: false
        files: \.rs$
        stages: [pre-commit]
      - id: check-crate-deps
        name: crate dep policy (forbidden edges)
        entry: bash scripts/check-crate-deps.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: lizard-rust
        name: lizard complexity (Rust CCN ≤ 10)
        entry: bash scripts/lizard-rust.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: fn-param-ratchet
        name: fn param cap (lizard max params ≤ 9)
        entry: bash scripts/fn-param-ratchet.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: fn-nloc-ratchet
        name: fn nloc + rust file lines (nloc ≤ 200, file ≤ 920)
        entry: bash scripts/fn-nloc-ratchet.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: tool-name-literal-ratchet
        name: builtin tool name literals (no new literals at comparison/match sites, #1155)
        entry: bash scripts/tool-name-literal-ratchet.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # cargo test（含 golden_sse_control / golden_turn_route_decision 等）仅在 CI 跑，见 .github/workflows/ci.yml 与 code-complexity.yml
      # Desktop/Android / 业务 UI：Client 仓 crabmate-client（路径 A Phase 4）
      - id: taplo-format
        name: taplo format (check)
        entry: >-
          bash -c 'if command -v taplo >/dev/null 2>&1; then taplo format --check .; else echo "taplo 未安装，跳过"; fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: taplo-lint
        name: taplo lint
        entry: >-
          bash -c 'if command -v taplo >/dev/null 2>&1; then taplo lint .; else echo "taplo 未安装，跳过"; fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # 版本号衍生文件（#1269）：`docs/openapi.json` 的 info.version 与两个 man 页的
      # 版本串都由 `[package] version` 派生。openapi 快照本身有 cargo test 守着，但它只在
      # client-contract job 跑、失败信息是「drifted (fields: ["info"])」，看不出与版本号
      # 有关（#1267 就是这么红的）；man 页此前**完全没有信号**——没人跑 gen-man 就永远绿。
      # 只做几次 grep/awk，毫秒级，故 always_run。修法：`make set-version VERSION=…`。
      - id: check-version-sync
        name: version sync (Cargo.toml → Cargo.lock · openapi.json · man/*.1)
        entry: bash scripts/check-version-sync.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: check-docs-links
        name: docs relative link check
        entry: python3 scripts/check-docs-links.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: check-public-api
        name: root public API list (S6 promise surface, #1297)
        entry: python3 scripts/check-public-api.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]


  - repo: https://github.com/crate-ci/typos
    rev: v1.35.5
    hooks:
      - id: typos

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          # 与 AGENTS.md → Repository engineering rules → Commit & push 的 type 列表对齐
          - build
          - chore
          - ci
          - docs
          - feat
          - fix
          - perf
          - refactor
          - revert
          - style
          - test
