<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CrabMate</title>
<style>
  :root {
    --bg0: #0a0d12;
    --bg1: #121820;
    --fg: #e8ecf1;
    --muted: #909dad;
    --accent: #7b90c4;
    --accent-dim: rgba(123, 144, 196, 0.3);
    --border: #2a3340;
    --danger: #c98c9b;
    --danger-bg: rgba(201, 140, 155, 0.14);
    --radius-btn: 5px;
    --font: "DM Sans", "Segoe UI", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(120% 80% at 50% 0%, #1a222d 0%, var(--bg0) 55%);
    color: var(--fg);
    font-family: var(--font);
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    position: relative;
  }
  .shell {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.25rem 1.35rem 1.5rem;
    text-align: center;
  }
  .mark {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: linear-gradient(145deg, #232c38, #121820);
    border: 1px solid var(--border);
    display: grid;
    place-items: center;
    margin-bottom: 0.85rem;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  .mark span {
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.04em;
  }
  h1 {
    margin: 0;
    font-size: 1.45rem;
    font-weight: 650;
    letter-spacing: 0.02em;
  }
  .tagline {
    margin: 0.35rem 0 1.25rem;
    font-size: 0.88rem;
    color: var(--muted);
  }
  .loader {
    width: 28px;
    height: 28px;
    border: 2.5px solid var(--accent-dim);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }
  .loader.is-hidden { display: none; }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .status {
    margin: 1rem 0 0;
    font-size: 0.92rem;
    color: var(--fg);
    min-height: 1.35em;
  }
  .detail {
    margin: 0.3rem 0 0;
    font-size: 0.78rem;
    color: var(--muted);
    max-width: 22rem;
    line-height: 1.45;
    min-height: 1.2em;
  }
  .error-box {
    display: none;
    margin-top: 0.85rem;
    width: min(100%, 22rem);
    text-align: left;
    padding: 0.7rem 0.8rem;
    border-radius: 8px;
    background: var(--danger-bg);
    border: 1px solid rgba(201, 140, 155, 0.35);
    color: #e8c4cc;
    font-size: 0.8rem;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 7.5rem;
    overflow: auto;
    -webkit-user-select: text;
    user-select: text;
  }
  .error-box.is-visible { display: block; }
  .actions {
    display: none;
    margin-top: 1rem;
    gap: 0.6rem;
  }
  .actions.is-visible { display: flex; }
  button {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--bg1);
    color: var(--fg);
    border-radius: var(--radius-btn);
    padding: 0.45rem 1rem;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary {
    background: rgb(47, 58, 78);
    border-color: rgb(78, 93, 123);
    color: var(--fg);
  }
  .hint {
    position: absolute;
    bottom: 0.7rem;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.7rem;
    color: #5c6570;
  }
  body.is-error .hint { display: none; }
</style>
</head>
<body>
<div class="shell">
  <div class="mark" aria-hidden="true"><span>C</span></div>
  <h1>CrabMate</h1>
  <p class="tagline">本地 AI 编程助手</p>
  <div id="loader" class="loader" role="status" aria-label="加载中"></div>
  <p id="status" class="status">正在启动…</p>
  <p id="detail" class="detail">准备本地后端服务</p>
  <div id="error" class="error-box" role="alert"></div>
  <div id="actions" class="actions">
    <button type="button" class="primary" id="btn-quit">退出</button>
  </div>
</div>
<p class="hint">首次启动可能需要数十秒（编译产物 / 前端静态资源）</p>
<script>
  const statusEl = document.getElementById("status");
  const detailEl = document.getElementById("detail");
  const loaderEl = document.getElementById("loader");
  const errorEl = document.getElementById("error");
  const actionsEl = document.getElementById("actions");

  window.setSplashStatus = function (status, detail) {
    if (typeof status === "string" && status.length) {
      statusEl.textContent = status;
    }
    if (typeof detail === "string") {
      detailEl.textContent = detail;
    }
  };

  window.setSplashError = function (message) {
    document.body.classList.add("is-error");
    loaderEl.classList.add("is-hidden");
    statusEl.textContent = "启动失败";
    detailEl.textContent = "本地后端未能就绪。可复制下方信息排查后重试。";
    errorEl.textContent = message || "未知错误";
    errorEl.classList.add("is-visible");
    actionsEl.classList.add("is-visible");
  };

  document.getElementById("btn-quit").addEventListener("click", async () => {
    try {
      if (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) {
        await window.__TAURI__.core.invoke("quit_desktop_app");
        return;
      }
    } catch (_) {}
    window.close();
  });
</script>
</body>
</html>
