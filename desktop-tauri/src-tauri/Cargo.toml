[package]
name = "crabmate-desktop"
version = "0.1.0"
description = "CrabMate desktop shell powered by Tauri"
authors = ["crabmate contributors"]
edition = "2024"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
victauri-plugin = { version = "0.8", optional = true }
tokio = { version = "1", features = ["sync"] }
url = "2"
serde_json = "1"
crabmate-config = { path = "../../crates/crabmate-config", default-features = false }
tauri-plugin-single-instance = "2.4.3"

[dev-dependencies]
victauri-test = "0.8"
victauri-plugin = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = []
victauri = ["dep:victauri-plugin"]

[workspace]
