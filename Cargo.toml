[workspace]
members = ["."]
# 壳专用 crabmate-connect 已迁至 Client 仓（路径 A Phase 4）；本仓不再 exclude 副本路径。
resolver = "2"

[workspace.dependencies]
# Shared third-party (pin versions; enable features per crate)
async-trait = "0.1"
base64 = "0.23"
bzip2 = "0.6"
chardetng = "1.0"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
console = { version = "0.16", default-features = false, features = ["std"] }
csv = "1.3"
diffy = "0.5"
ego-tree = "0.11"
encoding_rs = "0.8"
flate2 = "1.0"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
glob = "0.3"
http = "1"
ignore = "0.4"
jsonschema = { version = "0.50", default-features = false }
keyring = "4.1.5"
libc = "0.2"
log = "0.4"
path-absolutize = "4"
proptest = "1"
regex = "1"
# 与 rmcp 2.x（^0.13.2）对齐，避免默认图同时编 0.12 + 0.13。
# 启用 `fastembed` 时 hf-hub 仍可能再拉 reqwest 0.12（上游未升）；日常默认构建仅为 0.13。
reqwest = { version = "0.13", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = { version = "1", features = ["derive"] }
scraper = "0.27.0"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "yaml_serde", version = "0.10" }
# 与 keyring→secret-service / leptos wasm_split 对齐，避免同时编 0.10 + 0.11。
sha2 = "0.11"
similar = "3.1"
subtle = "2.6"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tiktoken-rs = { version = "0.12", default-features = false }
tokei = { version = "14", default-features = false }
tokio = { version = "1", default-features = false }
tokio-cron-scheduler = { version = "0.15", default-features = false }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
unicodeit = "0.2"
urlencoding = "2.1"
uom = { version = "0.38", features = ["si"] }
walkdir = "2"
# 联网搜索默认后端：本机浏览器 SERP（库路径；关闭 mcp 以免拉入 rmcp；≥0.2.2 含质量信号/抓取 API）
worbrow = { version = "0.2.2", default-features = false }
xz2 = "0.1"
zip = { version = "8.6", default-features = false, features = ["deflate", "time"] }

# HTTP / optional UI (feature-gated)
axum = { version = "0.8", default-features = false }
bollard = { version = "0.21", default-features = false }
clap_mangen = { version = "0.3", default-features = false }
fastembed = "6.0"
rmcp = { version = "3.0", default-features = false }
tower = { version = "0.5" }
tower-http = { version = "0.6" }

# Unix-only
nix = { version = "0.31", default-features = false }

[package]
name = "crabmate"
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
description = "Rust AI agent: OpenAI-compatible chat/completions, function calling, HTTP serve, ops CLI"
repository = "https://github.com/noisystreet/CrabMate"
homepage = "https://github.com/noisystreet/CrabMate"
readme = "README.md"
# 存在 `crabmate-gen-man` 时，`cargo run` 须默认主二进制（与 README「cargo run」一致）。
default-run = "crabmate"
# crates.io 源码包：编译与默认配置 / man；不含测试夹具、docs、packaging、本地 leftover `crates/`。
include = [
    "/src/",
    "/config/",
    "/man/",
    "/LICENSE",
    "/README.md",
    "/README.zh.md",
    "/fixtures/workflows/schema/",
]

[package.metadata.deb]
maintainer = "CrabMate <adustofsnow@163.com>"
license-file = "README.md"
extended-description = """\
CrabMate is a Rust AI agent that uses OpenAI-compatible chat/completions to reach LLM backends \
(e.g. DeepSeek, MiniMax, local Ollama). It supports function calling, workspace-oriented command \
and file tools, HTTP serve (Axum), and ops CLIs. Official Web UI / Desktop / crabmate-tui live in \
the Client repo. Configuration is TOML plus environment variables; see /usr/share/doc/crabmate/ \
after install."""
depends = "libc6 (>= 2.39)"
section = "utils"
priority = "optional"
# systemd 单元 + postinst（#DEBHELPER#）；默认不 enable / 不 start，需管理员显式 systemctl enable。
maintainer-scripts = "packaging/debian"
systemd-units = { unit-scripts = "packaging/systemd", enable = false, start = false }
assets = [
    # 二进制：安装到 /usr/bin
    ["target/release/crabmate", "usr/bin/crabmate", "755"],
    # 默认配置分片
    ["config/default_config.toml", "etc/crabmate/default_config.toml", "644"],
    ["config/session.toml", "etc/crabmate/session.toml", "644"],
    ["config/context_inject.toml", "etc/crabmate/context_inject.toml", "644"],
    ["config/tools.toml", "etc/crabmate/tools.toml", "644"],
    ["config/sandbox.toml", "etc/crabmate/sandbox.toml", "644"],
    ["config/planning.toml", "etc/crabmate/planning.toml", "644"],
    ["config/memory.toml", "etc/crabmate/memory.toml", "644"],
    ["packaging/systemd/crabmate.env.example", "etc/crabmate/crabmate.env.example", "644"],
    # 系统级主配置：锚定相对路径 `config/prompts/…` → `/etc/crabmate/config/prompts/`
    ["packaging/etc/config.toml", "etc/crabmate/config.toml", "644"],
    ["config/agent_roles.toml", "etc/crabmate/agent_roles.toml", "644"],
    ["config/prompts/base_system_prompt.md", "etc/crabmate/config/prompts/base_system_prompt.md", "644"],
    ["config/prompts/coding_workbench_increment.md", "etc/crabmate/config/prompts/coding_workbench_increment.md", "644"],
    ["config/prompts/thinking_avoid_echo_appendix.md", "etc/crabmate/config/prompts/thinking_avoid_echo_appendix.md", "644"],
    ["config/prompts/context_summary_system.md", "etc/crabmate/config/prompts/context_summary_system.md", "644"],
    ["config/prompts/context_summary_user.md", "etc/crabmate/config/prompts/context_summary_user.md", "644"],
    ["config/prompts/mode_ask.md", "etc/crabmate/config/prompts/mode_ask.md", "644"],
    ["config/prompts/mode_plan.md", "etc/crabmate/config/prompts/mode_plan.md", "644"],
    ["config/prompts/mode_act.md", "etc/crabmate/config/prompts/mode_act.md", "644"],
    ["config/prompts/companion_system_prompt.md", "etc/crabmate/config/prompts/companion_system_prompt.md", "644"],
    ["config/prompts/scientist_system_prompt.md", "etc/crabmate/config/prompts/scientist_system_prompt.md", "644"],
    ["config/prompts/engineer_system_prompt.md", "etc/crabmate/config/prompts/engineer_system_prompt.md", "644"],
    ["config/prompts/philosopher_system_prompt.md", "etc/crabmate/config/prompts/philosopher_system_prompt.md", "644"],
    ["config/prompts/literary_system_prompt.md", "etc/crabmate/config/prompts/literary_system_prompt.md", "644"],
    ["config/prompts/code_reviewer_system_prompt.md", "etc/crabmate/config/prompts/code_reviewer_system_prompt.md", "644"],
    # 文档
    ["README.md", "usr/share/doc/crabmate/README.md", "644"],
    # man page（troff；由 `cargo run --features gen-man --bin crabmate-gen-man` 再生成）
    ["man/crabmate.1", "usr/share/man/man1/crabmate.1", "644"],
]

[features]
default = ["server"]
## 线契约：类型、SSE 分类/帧、Turn 布局、导出 schema（无 tokio）。Client WASM 只开本 feature；模块以 `cfg(feature = "protocol")` 门控（`server` 会启用本 feature）。
protocol = []
## 默认：HTTP serve、运维 CLI、工具执行。含 protocol。
server = [
    "protocol",
    "web",
    "mcp",
    "archive-tools",
    "web-fetch-tools",
    "schema-tools",
    "csv-tools",
    "diff-tools",
    "unit-tools",
    "dep:reqwest",
    "dep:futures-util",
    "dep:secrecy",
    "dep:serde_yaml",
    "dep:tempfile",
    "dep:tokio",
    "dep:chrono",
    "dep:regex",
    "dep:sha2",
    "dep:subtle",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:console",
    "dep:tokio-stream",
    "dep:async-trait",
    "dep:libc",
    "dep:tiktoken-rs",
    "dep:clap",
    "dep:toml",
    "dep:keyring",
    "dep:unicodeit",
    "dep:base64",
    "dep:glob",
    "dep:ignore",
    "dep:path-absolutize",
    "dep:diffy",
    "dep:walkdir",
    "dep:worbrow",
    "dep:urlencoding",
    "dep:jsonschema",
    "dep:rusqlite",
    "dep:nix",
]
## Axum HTTP、`serve`、会话 SQLite、`/chat` 队列等。
web = [
    "dep:axum",
    "dep:tokio-cron-scheduler",
    "dep:tower",
    "dep:tower-http",
]
## `cargo run --bin crabmate-gen-man` 生成 troff 手册页。
gen-man = ["dep:clap_mangen"]
## Model Context Protocol（`rmcp`）：`mcp list` / `mcp serve`、进程内 MCP 工具代理。
mcp = ["dep:rmcp", "dep:http"]
## `code_stats` / 项目画像 tokei 统计（未启用时用内置扩展名 walk）。
project_metrics = ["dep:tokei"]
## `sync_default_tool_sandbox_mode = docker` 时连接 Docker Engine（`bollard`）。
docker_sandbox = ["dep:bollard"]
## 本地向量嵌入（**fastembed** / ONNX）：长期记忆 `fastembed` 后端、`codebase_semantic_search` 的向量索引与 hybrid/semantic 查询。
fastembed = ["dep:fastembed"]
## 压缩归档：tar/zip/tar.gz/tar.bz2/tar.xz 的打包和解包
archive-tools = ["dep:bzip2", "dep:flate2", "dep:tar", "dep:xz2", "dep:zip"]
## HTTP 抓取：编码检测 + HTML 解析
web-fetch-tools = ["dep:chardetng", "dep:encoding_rs", "dep:scraper", "dep:ego-tree"]
## JSON Schema 校验（`jsonschema` 由 `server` 启用；本名为 `cfg` 开关）
schema-tools = []
## CSV/TSV 数据格式
csv-tools = ["dep:csv"]
## 文本差异对比
diff-tools = ["dep:similar"]
## 单位换算
unit-tools = ["dep:uom"]

[dependencies]
# protocol（始终编译 `cm_types` / SSE 分类 / Turn 布局等）
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
schemars = { workspace = true }
log = { workspace = true }
# 后台任务 `tool_job_id`（随机不透明，不可枚举）——契约 `background_tool_jobs_contract.md` §3.3
getrandom = { workspace = true }

# server
# `gzip`/`brotli`/`deflate`：`http_fetch`/`http_request` 向 curl 对齐——自动发送对应 `Accept-Encoding` 并解压响应体（未开 `zstd` 以避免 zstd-sys 的 C 编译负担）。
reqwest = { workspace = true, optional = true, features = ["json", "stream", "blocking", "query", "rustls", "gzip", "brotli", "deflate"] }
futures-util = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
# 避免 `full`：仅启用代码路径实际用到的子特性，缩短 `cargo build` / `cargo check` 解析与编译图。
tokio = { workspace = true, optional = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "fs",
    "net",
    "process",
    "io-util",
    "signal",
] }
chrono = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true, features = [
    "ansi",
    "env-filter",
    "fmt",
    "json",
    "local-time",
    "time",
    "tracing-log",
] }
console = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
tiktoken-rs = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
keyring = { workspace = true, optional = true }
unicodeit = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
glob = { workspace = true, optional = true }
ignore = { workspace = true, optional = true }
path-absolutize = { workspace = true, optional = true }
diffy = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }
worbrow = { workspace = true, optional = true }
urlencoding = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
axum = { workspace = true, optional = true, features = [
    "form",
    "http1",
    "json",
    "matched-path",
    "multipart",
    "original-uri",
    "query",
    "tokio",
    "tower-log",
    "tracing",
] }
tokio-cron-scheduler = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true, features = ["fs", "set-header", "cors"] }
clap_mangen = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true, default-features = false, features = [
    "client",
    "server",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-client-reqwest",
] }
http = { workspace = true, optional = true }
bollard = { workspace = true, optional = true, default-features = false, features = [
    "http",
    "pipe",
] }
fastembed = { workspace = true, optional = true }
tokei = { workspace = true, optional = true }
bzip2 = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
xz2 = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
chardetng = { workspace = true, optional = true }
encoding_rs = { workspace = true, optional = true }
scraper = { workspace = true, optional = true }
ego-tree = { workspace = true, optional = true }
csv = { workspace = true, optional = true }
similar = { workspace = true, optional = true }
uom = { workspace = true, optional = true }
nix = { workspace = true, optional = true, features = ["fs", "dir", "signal", "term", "process"] }

[[bin]]
name = "crabmate"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "crabmate-gen-man"
path = "src/bin/crabmate_gen_man.rs"
required-features = ["gen-man"]

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }

[profile.release]
# 默认关闭 LTO，加快 `cargo build --release`；体积敏感发布可改用下方 `release-lto` profile。
lto = false

[profile.release-lto]
inherits = "release"
lto = true
codegen-units = 1
