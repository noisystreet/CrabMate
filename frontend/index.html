<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CrabMate</title>
    <!-- 首绘前底色：避免桌面/移动 WebView 默认黑屏（与 tokens --bg 对齐） -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0d12;
        color: #e8eaed;
      }
      #cm-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: radial-gradient(120% 80% at 50% 0%, #1e2630 0%, #0a0d12 55%);
        font-family: "Segoe UI", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      #cm-boot-splash .cm-boot-mark {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.04em;
        color: #3d9a8b;
        background: linear-gradient(145deg, #2a3340, #161b22);
        border: 1px solid #2f3845;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      #cm-boot-splash .cm-boot-title {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 650;
        letter-spacing: 0.02em;
      }
      #cm-boot-splash .cm-boot-status {
        margin: 0;
        font-size: 0.9rem;
        color: #8b939e;
      }
      #cm-boot-splash .cm-boot-loader {
        width: 28px;
        height: 28px;
        border: 2.5px solid rgba(61, 154, 139, 0.35);
        border-top-color: #3d9a8b;
        border-radius: 50%;
        animation: cm-boot-spin 0.75s linear infinite;
      }
      @keyframes cm-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- Trunk 不会把 @import 打进单文件，也不会复制未声明的 CSS；须逐条声明，否则 dist 缺样式 -->
    <!-- components.css 中 brand-mark 背景图为 url("../brand-mark.svg")→打包后与 CSS 同目录上一级即站点根 /brand-mark.svg -->
    <link data-trunk rel="copy-file" href="brand-mark.svg" />
    <link data-trunk rel="css" href="styles/tokens.css" />
    <link data-trunk rel="css" href="themes/light.css" />
    <link data-trunk rel="css" href="themes/material.css" />
    <link data-trunk rel="css" href="themes/high-contrast.css" />
    <link data-trunk rel="css" href="styles/base.css" />
    <link data-trunk rel="css" href="styles/components.css" />
    <link data-trunk rel="css" href="styles/layout-chat.css" />
    <link data-trunk rel="css" href="styles/shell-topbar.css" />
    <link data-trunk rel="css" href="styles/ide-layout.css" />
    <link data-trunk rel="copy-file" href="vendor/ide-codemirror.js" data-target-path="vendor" />
    <link data-trunk rel="css" href="styles/ide-codemirror.css" />
    <link data-trunk rel="css" href="styles/ide-highlight.css" />
    <link data-trunk rel="css" href="styles/shell-ds.css" />
    <link data-trunk rel="css" href="styles/tauri-shell.css" />
    <link data-trunk rel="css" href="styles/sidebar.css" />
    <link data-trunk rel="css" href="styles/status.css" />
    <link data-trunk rel="css" href="styles/approval.css" />
    <link data-trunk rel="css" href="styles/modal.css" />
    <link data-trunk rel="css" href="styles/mobile.css" />
    <link data-trunk rel="css" href="styles/motion.css" />
  </head>
  <body>
    <div id="cm-boot-splash" role="status" aria-live="polite" aria-busy="true">
      <div class="cm-boot-mark" aria-hidden="true">C</div>
      <p class="cm-boot-title">CrabMate</p>
      <div class="cm-boot-loader" aria-hidden="true"></div>
      <p class="cm-boot-status">正在加载界面…</p>
    </div>
    <script src="/vendor/ide-codemirror.js"></script>
    <!--
      Trunk：`trunk build`（默认 dev）不跑 wasm-opt，迭代快；`trunk build --release` 使用默认 wasm-opt。
      workspace 根 Cargo.toml 对 crabmate-web 设 opt-level="z"；release 默认无 LTO（`release-lto` profile 可选）。
      当前 release WASM：~9.7MB（raw）→ wasm-opt → ~3.4MB（gzip 后约 1.5MB）。
      wasm-opt 须在 PATH 中（`cargo install wasm-opt`），否则 trunk build --release 产出空文件。
      若要跳过 wasm-opt 可加 `data-wasm-opt="0"`（见 Trunk 文档）。
    -->
    <link data-trunk rel="rust" />
  </body>
</html>
