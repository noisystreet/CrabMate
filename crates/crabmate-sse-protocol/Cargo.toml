[package]
name = "crabmate-sse-protocol"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Shared SSE control-plane protocol and runtime for CrabMate (Rust server + Leptos WASM)"
repository = "https://github.com/noisystreet/CrabMate"
readme = "../../docs/design/client_contract_versioning.md"

[features]
default = ["runtime"]
## 广播中枢、mpsc 桥、审批 SSE（`tokio`）。WASM / 外仓分类器请 `--no-default-features`。
runtime = ["dep:tokio"]

[dependencies]
crabmate-types = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true, features = ["sync"] }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
