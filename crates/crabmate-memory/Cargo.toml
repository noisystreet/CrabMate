[package]
name = "crabmate-memory"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "CrabMate long-term memory and semantic index"

[features]
default = []
fastembed = ["dep:fastembed", "crabmate-config/fastembed"]

[dependencies]
crabmate-config = { workspace = true }
crabmate-types = { workspace = true }
fastembed = { version = "5.13", optional = true }
glob = { workspace = true }
ignore = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "sync",
    "time",
    "fs",
] }

[dev-dependencies]
serde_json = { workspace = true }
