<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>crabmate</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1419;
        --fg: #e7ecf1;
        --muted: #9aa7b5;
        --accent: #3d8bfd;
        --field: #1a222c;
        --border: #2a3542;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
        background: radial-gradient(120% 80% at 50% 0%, #1a2838 0%, var(--bg) 55%);
        color: var(--fg);
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding: 0.85rem 1.05rem
          calc(0.85rem + max(var(--cm-safe-bottom, 0px), env(safe-area-inset-bottom, 0px)));
        padding-top: calc(0.85rem + var(--cm-safe-top, env(safe-area-inset-top, 0px)));
      }
      h1 {
        margin: 0.15rem 0 0.2rem;
        font-size: 1.4rem;
        font-weight: 650;
        letter-spacing: 0.02em;
      }
      p.lead {
        margin: 0 0 0.75rem;
        color: var(--muted);
        line-height: 1.35;
        max-width: 28rem;
        font-size: 0.88rem;
      }
      label {
        display: block;
        font-size: 0.82rem;
        color: var(--muted);
        margin-bottom: 0.25rem;
      }
      input {
        width: 100%;
        padding: 0.6rem 0.75rem;
        border-radius: 0.55rem;
        border: 1px solid var(--border);
        background: var(--field);
        color: var(--fg);
        font-size: 0.95rem;
        margin-bottom: 0.55rem;
      }
      button {
        width: 100%;
        padding: 0.7rem 1rem;
        border: 0;
        border-radius: 0.55rem;
        background: var(--accent);
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      button:active:not(:disabled) {
        filter: brightness(0.92);
      }
      .hint {
        margin-top: 0.65rem;
        font-size: 0.75rem;
        color: var(--muted);
        line-height: 1.35;
      }
      .err {
        color: #ff8e8e;
        font-size: 0.85rem;
        min-height: 0;
        margin: 0 0 0.4rem;
        white-space: pre-wrap;
      }
      .err:empty {
        display: none;
      }
      .status {
        color: var(--muted);
        font-size: 0.85rem;
        min-height: 0;
        margin: 0 0 0.25rem;
      }
      .status:empty {
        display: none;
      }
      code {
        font-size: 0.85em;
      }
    </style>
  </head>
  <body>
    <h1>crabmate</h1>
    <p class="lead" id="lead">
      连接到已有的 <code>crabmate serve</code>。填写服务器地址与 Web API 共享密钥（与
      <code>CM_WEB_API_BEARER_TOKEN</code> 一致；不是模型 API_KEY）。
    </p>
    <form id="connect-form" method="post" action="#" autocomplete="on">
      <label for="url">服务器地址</label>
      <input
        id="url"
        name="username"
        type="url"
        inputmode="url"
        autocomplete="username"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="http://192.168.1.10:8080/"
        required
      />
      <label for="bearer">Web API 共享密钥（可选）</label>
      <input
        id="bearer"
        name="password"
        type="password"
        autocomplete="current-password"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="与 CM_WEB_API_BEARER_TOKEN 相同（不是模型 API_KEY）"
      />
      <p class="status" id="status" aria-live="polite"></p>
      <p class="err" id="err" aria-live="assertive"></p>
      <button type="submit" id="submit">连接</button>
    </form>
    <p class="hint">
      局域网可用明文 HTTP；公网请用 HTTPS + Bearer。成功后会记住地址；非空 Bearer 写入系统钥匙串。
    </p>
    <script>
      const URL_KEY = "crabmate.connect.serverUrl";
      const BEARER_KEY_LEGACY_MOBILE = "crabmate.mobile.webApiBearer";
      const URL_KEY_LEGACY_MOBILE = "crabmate.mobile.serverUrl";
      const form = document.getElementById("connect-form");
      const urlInput = document.getElementById("url");
      const bearerInput = document.getElementById("bearer");
      const err = document.getElementById("err");
      const statusEl = document.getElementById("status");
      const submitBtn = document.getElementById("submit");
      const leadEl = document.getElementById("lead");
      /** 防止自动登录与手动提交并发探测 */
      let connectInFlight = false;
      /** 桌面 sidecar 本轮 `web_ready` URL；端口每次启动会变 */
      let suggestedServerUrl = "";

      function wantsManualConnect() {
        try {
          return new URLSearchParams(location.search).get("manual") === "1";
        } catch (_) {
          return false;
        }
      }

      function isLoopbackHost(host) {
        const h = (host || "").toLowerCase();
        return (
          h === "127.0.0.1" ||
          h === "localhost" ||
          h === "::1" ||
          h === "[::1]"
        );
      }

      function isLoopbackUrl(href) {
        try {
          return isLoopbackHost(new URL(href).hostname);
        } catch (_) {
          return false;
        }
      }

      function tauriCore() {
        return window.__TAURI__ && window.__TAURI__.core;
      }

      function invoke(cmd, args) {
        const core = tauriCore();
        if (!core || typeof core.invoke !== "function") {
          return Promise.reject("Tauri IPC 不可用");
        }
        return core.invoke(cmd, args || {});
      }

      (function applySafeInsets() {
        function run() {
          try {
            const b = window.CrabMateMobile;
            if (!b || typeof b.getStatusBarInsetPx !== "function") return false;
            let top = Number(b.getStatusBarInsetPx());
            if (!Number.isFinite(top) || top < 0) top = 24;
            top = Math.max(top, 24);
            let bottom = 24;
            if (typeof b.getNavBarInsetPx === "function") {
              bottom = Number(b.getNavBarInsetPx());
              if (!Number.isFinite(bottom) || bottom < 0) bottom = 24;
              bottom = Math.max(bottom, 24);
            }
            const root = document.documentElement;
            root.style.setProperty("--cm-safe-top", top + "px");
            root.style.setProperty("--cm-safe-bottom", bottom + "px");
            root.setAttribute("data-cm-mobile-shell", "");
            return true;
          } catch (_) {
            return false;
          }
        }
        if (!run()) {
          [50, 200, 600].forEach(function (ms) {
            setTimeout(run, ms);
          });
        }
      })();

      function readLegacyUrl() {
        try {
          return (
            localStorage.getItem(URL_KEY) ||
            localStorage.getItem(URL_KEY_LEGACY_MOBILE) ||
            ""
          );
        } catch (_) {
          return "";
        }
      }

      function readLegacyBearer() {
        try {
          return localStorage.getItem(BEARER_KEY_LEGACY_MOBILE) || "";
        } catch (_) {
          return "";
        }
      }

      async function hydrateFields() {
        let suggested = "";
        try {
          suggested = (await invoke("get_suggested_server_url")) || "";
        } catch (_) {}
        suggestedServerUrl = (suggested || "").trim();
        if (suggestedServerUrl) {
          leadEl.innerHTML =
            "连接到 <code>crabmate serve</code>。桌面已拉起本机后端时，地址会预填；也可改为局域网/远程服务器。连接成功的非空 Bearer 写入系统钥匙串。";
        }

        const savedUrl = readLegacyUrl();
        // 桌面 sidecar 使用 --port 0：勿用上次记住的 127.0.0.1:旧端口覆盖本轮建议地址。
        if (suggestedServerUrl && (!savedUrl || isLoopbackUrl(savedUrl))) {
          urlInput.value = suggestedServerUrl;
        } else if (savedUrl) {
          urlInput.value = savedUrl;
        } else if (suggestedServerUrl) {
          urlInput.value = suggestedServerUrl;
        }

        let keyringBearer = "";
        try {
          keyringBearer = (await invoke("get_connect_bearer")) || "";
        } catch (_) {}
        if (keyringBearer) {
          bearerInput.value = keyringBearer;
        } else {
          const legacy = readLegacyBearer();
          if (legacy) bearerInput.value = legacy;
        }
      }

      function setBusy(busy, msg) {
        submitBtn.disabled = !!busy;
        statusEl.textContent = msg || "";
      }

      function mobileBridge() {
        return window.CrabMateMobile || null;
      }

      function notifyAutofillSuccess() {
        try {
          const b = mobileBridge();
          if (b && typeof b.notifyLoginSuccess === "function") {
            b.notifyLoginSuccess();
          }
        } catch (_) {}
      }

      function notifyAutofillFailure() {
        try {
          const b = mobileBridge();
          if (b && typeof b.notifyLoginFailure === "function") {
            b.notifyLoginFailure();
          }
        } catch (_) {}
      }

      function invokeConnect(url, bearer) {
        const core = tauriCore();
        if (!core || typeof core.invoke !== "function") {
          return Promise.reject(
            "Tauri IPC 不可用：请在桌面/移动壳内连接（勿在普通浏览器直接打开连接页）"
          );
        }
        return core.invoke("connect_remote", { url, bearer: bearer || "" });
      }

      function persistUrl(href) {
        try {
          // 本机随机端口不落盘，避免下次自动连到已退出的旧端口。
          if (suggestedServerUrl && isLoopbackUrl(href)) {
            return;
          }
          localStorage.setItem(URL_KEY, href);
          // 兼容旧移动端键，避免升级后丢地址
          localStorage.setItem(URL_KEY_LEGACY_MOBILE, href);
        } catch (_) {}
      }

      function persistBearerFallback(bearer) {
        // Android 等可能无钥匙串：仍把非空 Bearer 记在壳 localStorage，供下次预填。
        try {
          const b = (bearer || "").trim();
          if (b) {
            localStorage.setItem(BEARER_KEY_LEGACY_MOBILE, b);
          }
        } catch (_) {}
      }

      async function connectWithValues(rawUrl, bearer, opts) {
        if (connectInFlight) {
          return false;
        }
        const fromAuto = !!(opts && opts.fromAuto);
        err.textContent = "";
        let raw = (rawUrl || "").trim();
        if (!raw) {
          err.textContent = "请填写服务器地址";
          return false;
        }
        if (!/^https?:\/\//i.test(raw)) {
          raw = "http://" + raw;
        }
        let u;
        try {
          u = new URL(raw);
        } catch (_) {
          err.textContent = "地址无效";
          return false;
        }
        if (u.protocol !== "http:" && u.protocol !== "https:") {
          err.textContent = "仅支持 http/https";
          return false;
        }
        connectInFlight = true;
        setBusy(true, fromAuto ? "已记住连接，正在自动登录…" : "正在探测服务器…");
        try {
          await invokeConnect(u.href, bearer);
          persistUrl(u.href);
          persistBearerFallback(bearer);
          if (!fromAuto) {
            notifyAutofillSuccess();
          }
          setBusy(true, "已连接，正在打开界面…");
          return true;
        } catch (ex) {
          connectInFlight = false;
          if (!fromAuto) {
            notifyAutofillFailure();
          }
          const msg =
            typeof ex === "string"
              ? ex
              : ex && ex.message
                ? ex.message
                : String(ex);
          err.textContent = fromAuto
            ? "自动登录失败：" + msg + "\n请核对地址与共享密钥后重试。"
            : msg;
          setBusy(false, "");
          return false;
        }
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        await connectWithValues(urlInput.value, bearerInput.value, {
          fromAuto: false,
        });
      });

      (async function boot() {
        await hydrateFields();
        if (wantsManualConnect()) {
          return;
        }
        const saved = readLegacyUrl();
        let target = "";
        let shouldAuto = false;
        if (suggestedServerUrl) {
          // 桌面：优先本轮 sidecar 建议地址；已存远程地址则沿用。
          target = urlInput.value || suggestedServerUrl;
          shouldAuto = !!target;
        } else if (saved) {
          target = saved;
          shouldAuto = true;
        }
        if (!shouldAuto || !target) {
          return;
        }
        const bearer = bearerInput.value || "";
        setTimeout(function () {
          connectWithValues(target, bearer, { fromAuto: true });
        }, 80);
      })();
    </script>
  </body>
</html>
