[package]
name = "crabmate-connect"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Shared connect-page helpers for CrabMate shells (probe /health+/prefs, Bearer handoff, keyring)"
publish = false

[dependencies]
keyring = "4.1.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
url = "2"
urlencoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
