[package]
name = "crabmate-connect"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Shared connect-page helpers for CrabMate shells (probe /health+/prefs, Bearer handoff, keyring)"
repository = "https://github.com/noisystreet/CrabMate"
readme = "README.md"
# 默认经 git tag + path 钉版本（见 docs/design/client_contract_versioning.md）；勿加入主 workspace members。
publish = false

# 独立单包 workspace：根 workspace 含 members=["."] 时，仅 exclude 不足以用
# `--manifest-path` 解析本包；须自带空 [workspace]（见 Cargo 提示）。
# 根 Cargo.toml 亦 exclude = ["crates/crabmate-connect"]。
[workspace]

[dependencies]
keyring = "4.1.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
url = "2"
urlencoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
