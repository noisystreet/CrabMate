# 圈复杂度（lizard：src/ 每个函数 CCN ≤ 10）、函数形参上限（fn-param：≤ 9）、函数 nloc + 源文件行数上限（fn-nloc：nloc ≤ 200、单文件 ≤ 920），与 scripts/*.sh / pre-commit 对齐；另含 fixtures 金样测试（`golden_turn_completion`、`golden_acceptance_regression`、`golden_turn_route_decision`、`golden_outer_loop_phase`、`golden_final_plan_gate`、`golden_workflow_to_plan_requirement`、`golden_workflow_reflection_regression`）。
name: code-complexity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lizard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install lizard
        run: pip install lizard

      - name: Run lizard (Rust CCN ≤ 10)
        run: bash scripts/lizard-rust.sh

      - name: Run fn-param cap (Rust max function params ≤ 9)
        run: bash scripts/fn-param-ratchet.sh

      - name: Run fn-nloc (nloc ≤ 200, file lines ≤ 920)
        run: bash scripts/fn-nloc-ratchet.sh

  fsm-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (OpenSSL / libssh2 / Wayland for default features build)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libssh2-1-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Golden turn project web (fixtures/turn_project_web_golden.jsonl)
        run: cargo test --lib golden_turn_project_web --no-fail-fast

      - name: Golden turn route decision (fixtures/turn_route_decision_golden.jsonl)
        run: cargo test golden_turn_route_decision --no-fail-fast

      - name: Golden outer loop phase (fixtures/outer_loop_phase_golden.jsonl)
        run: cargo test --lib golden_outer_loop_phase --no-fail-fast

  turn-completion-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (OpenSSL / libssh2 / Wayland for default features build)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libssh2-1-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Golden turn completion (fixtures/turn_completion_golden.jsonl)
        run: cargo test golden_turn_completion --no-fail-fast

  acceptance-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (OpenSSL / libssh2 / Wayland for default features build)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libssh2-1-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Golden acceptance regression (fixtures/acceptance_regression.jsonl)
        run: cargo test --lib golden_acceptance_regression --no-fail-fast

  final-plan-gate-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (OpenSSL / libssh2 / Wayland for default features build)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libssh2-1-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Golden final plan gate (src/cm_agent/fixtures/final_plan_gate_golden.jsonl)
        run: cargo test --lib golden_final_plan_gate --no-fail-fast

      - name: Golden workflow→plan requirement (fixtures/workflow_to_plan_requirement_golden.jsonl)
        run: cargo test --lib golden_workflow_to_plan_requirement --no-fail-fast

  workflow-reflection-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (OpenSSL / libssh2 / Wayland for default features build)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libssh2-1-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Golden workflow reflection (fixtures/workflow_reflection_regression.jsonl)
        run: cargo test golden_workflow_reflection_regression --no-fail-fast
