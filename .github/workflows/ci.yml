# 主 CI：编译检查、Clippy（-D warnings）与工作区测试，防止错误合入 main。
# 与 pre-commit 的 cargo clippy 对齐；cargo test 仅在本 workflow（及 code-complexity）跑。
#
# 官方 Client（业务 UI + Desktop/Android 壳）CI：同级 crabmate-client/.github/workflows/ci.yml。
# 本仓不再跑 Tauri/GTK / frontend wasm。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workspace:
    name: check · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # check + clippy + test 易占满 runner 磁盘；先回收预装大目录。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          df -h

      - name: Install system deps (OpenSSL / libssh2 / Wayland)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libssh2-1-dev libwayland-dev

      # edition 2024 需 Rust 1.85+；stable 满足即可。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (workspace, all targets)
        run: cargo check --workspace --all-targets --all-features

      - name: crate dependency policy (forbidden edges)
        run: bash scripts/check-crate-deps.sh

      - name: cargo check (crabmate default features)
        run: cargo check -p crabmate

      - name: cargo clippy (workspace, -D warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test (workspace)
        run: |
          # Reuse check/clippy artifacts (do not `cargo clean` — it wiped rust-cache gains).
          # If the runner is still tight after Free disk space, drop incremental only.
          FREE_KB="$(df -Pk . | awk 'NR==2 {print $4}')"
          echo "free disk before test: ${FREE_KB} KiB"
          if [ "${FREE_KB}" -lt 5242880 ]; then
            echo "low disk (<5 GiB free); removing target/*/incremental only"
            rm -rf target/*/incremental
            df -h
          fi
          cargo test --workspace --all-features --no-fail-fast

  # 路径 A Phase 1：契约可发布门禁（SSE 金样 + OpenAPI + 外仓风格 path 消费）。
  # 权威：docs/design/client_contract_versioning.md
  client-contract:
    name: client contract (SSE · OpenAPI · consumer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (OpenSSL / libssh2 / Wayland)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libssh2-1-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: check-client-contract.sh
        run: bash scripts/check-client-contract.sh

  # server-only 发布冒烟：tar.gz + .deb（不附带 frontend；对齐 make package）
  build-release:
    name: package (tar.gz · deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libssh2-1-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: make package (server-only)
        run: make package

      - name: Verify package artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          tars=(dist/crabmate_*.tar.gz)
          debs=(dist/crabmate_*.deb)
          [[ ${#tars[@]} -ge 1 ]] || { echo "missing dist/*.tar.gz" >&2; ls -la dist || true; exit 1; }
          [[ ${#debs[@]} -ge 1 ]] || { echo "missing dist/*.deb (cargo-deb)" >&2; ls -la dist || true; exit 1; }
          TAR="${tars[0]}"
          DEB="${debs[0]}"
          echo "tar: $TAR ($(stat --format=%s "$TAR") bytes)"
          echo "deb: $DEB ($(stat --format=%s "$DEB") bytes)"
          # tar 含 release 二进制与 man；不得含 frontend/dist（server-only）
          tar -tzf "$TAR" | tee /tmp/package-tar.list
          grep -E '/crabmate$' /tmp/package-tar.list
          grep -E '/man/crabmate\.1$' /tmp/package-tar.list
          grep -E '/systemd/crabmate\.service$' /tmp/package-tar.list
          grep -E '/systemd/crabmate\.env\.example$' /tmp/package-tar.list
          grep -E '/etc/crabmate/config\.toml$' /tmp/package-tar.list
          grep -E '/etc/crabmate/config/prompts/base_system_prompt\.md$' /tmp/package-tar.list
          if grep -E '/frontend/dist/' /tmp/package-tar.list; then
            echo "unexpected frontend/dist in server-only tarball" >&2
            exit 1
          fi
          # deb 含 /usr/bin/crabmate + systemd unit（默认不 enable）
          # dpkg-deb -c 行尾为 ./usr/bin/crabmate
          dpkg-deb -c "$DEB" | tee /tmp/package-deb.list
          grep -E '/usr/bin/crabmate$' /tmp/package-deb.list
          grep -E '/usr/lib/systemd/system/crabmate\.service$' /tmp/package-deb.list
          grep -E '/etc/crabmate/crabmate\.env\.example$' /tmp/package-deb.list
          grep -E '/etc/crabmate/config\.toml$' /tmp/package-deb.list
          grep -E '/etc/crabmate/config/prompts/base_system_prompt\.md$' /tmp/package-deb.list
          rm -rf /tmp/package-deb-root
          dpkg-deb -x "$DEB" /tmp/package-deb-root
          grep -F -- '--config /etc/crabmate/config.toml' /tmp/package-deb-root/usr/lib/systemd/system/crabmate.service
          # packaged unit must not force --no-web on ExecStart (blocks CM_WEB_STATIC_DIR)
          if grep -E '^ExecStart=.*--no-web' /tmp/package-deb-root/usr/lib/systemd/system/crabmate.service; then
            echo "unexpected --no-web in packaged unit" >&2
            exit 1
          fi
          grep -E '^StartLimitBurst=' /tmp/package-deb-root/usr/lib/systemd/system/crabmate.service
          if grep -E '/usr/share/crabmate/frontend/' /tmp/package-deb.list; then
            echo "unexpected UI path in server .deb" >&2
            exit 1
          fi
          echo "package smoke ok"
