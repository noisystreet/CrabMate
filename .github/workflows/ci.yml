# 主 CI：编译检查、Clippy（-D warnings）与工作区测试，防止错误合入 main。
# 与 pre-commit 的 cargo clippy / frontend-wasm-check 对齐；cargo test 仅在本 workflow（及 code-complexity 金样）跑。
#
# desktop-tauri 是独立 workspace（含 Victauri E2E 测试），与主 workspace 并行执行。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workspace:
    name: check · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # check + clippy + test 易占满 runner 磁盘；先回收预装大目录。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          df -h

      - name: Install system deps (OpenSSL / libssh2 / Wayland)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libssh2-1-dev libwayland-dev

      # edition 2024 需 Rust 1.85+；stable 满足即可。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Add wasm32 target (frontend)
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (workspace, all targets)
        run: cargo check --workspace --all-targets --all-features

      - name: cargo check (crabmate default features)
        run: cargo check -p crabmate

      - name: cargo check (frontend wasm32)
        run: cargo check --manifest-path frontend/Cargo.toml --target wasm32-unknown-unknown --all-targets

      - name: cargo clippy (workspace, -D warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo clippy (frontend, -D warnings)
        run: cargo clippy --manifest-path frontend/Cargo.toml --all-targets --all-features -- -D warnings

      - name: cargo test (workspace)
        run: |
          # check/clippy 已验证编译；清理 dev 产物为 test 链接腾出空间（避免 No space left on device）。
          cargo clean
          cargo test --workspace --all-features --no-fail-fast

  desktop:
    name: desktop (check · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true

      - name: Install system deps (OpenSSL / libssh2 / libgtk-3 / libwebkit2gtk / libappindicator)
        run: sudo apt-get update && sudo apt-get install -y \
          libssl-dev libssh2-1-dev \
          libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # tauri-build 校验 externalBin 存在性；CI 中 only check/test，创建 dummy sidecar
      - name: Create dummy files for tauri-build
        run: |
          mkdir -p desktop-tauri/binaries desktop-tauri/dist
          touch desktop-tauri/binaries/crabmate-x86_64-unknown-linux-gnu
          echo '<html></html>' > desktop-tauri/dist/index.html

      - name: cargo check (all targets)
        run: cargo check --tests
        working-directory: desktop-tauri/src-tauri

      - name: cargo clippy (-D warnings)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: desktop-tauri/src-tauri

      - name: cargo test (Victauri auto-skip)
        run: cargo test --no-fail-fast
        working-directory: desktop-tauri/src-tauri

  build-release:
    name: release build (package test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libssh2-1-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 target & install trunk
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install trunk --locked

      - uses: Swatinem/rust-cache@v2

      - name: Build frontend WASM + backend binary (release)
        run: make backend-release frontend-release

      - name: Smoke test — binary runs and prints version
        run: |
          ./target/release/crabmate --version
          ./target/release/crabmate doctor --dry-run
          # 验证前端静态文件被正确嵌入 dist
          test -f frontend/dist/index.html && echo "✅ dist/index.html 存在"
          # 验证二进制体积（粗略检查，防意外膨胀）
          BIN_SIZE=$(stat --format=%s target/release/crabmate)
          echo "crabmate release binary: $BIN_SIZE bytes ($(( BIN_SIZE / 1048576 )) MiB)"
