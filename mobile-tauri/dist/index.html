<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>crabmate</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1419;
        --fg: #e7ecf1;
        --muted: #9aa7b5;
        --accent: #3d8bfd;
        --field: #1a222c;
        --border: #2a3542;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
        background: radial-gradient(120% 80% at 50% 0%, #1a2838 0%, var(--bg) 55%);
        color: var(--fg);
        display: flex;
        flex-direction: column;
        padding: 1.5rem 1.25rem calc(2rem + max(var(--cm-safe-bottom, 0px), env(safe-area-inset-bottom, 0px)));
        padding-top: calc(1.5rem + var(--cm-safe-top, env(safe-area-inset-top, 0px)));
      }
      h1 {
        margin: 1.5rem 0 0.35rem;
        font-size: 1.75rem;
        font-weight: 650;
        letter-spacing: 0.02em;
      }
      p.lead {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.45;
        max-width: 28rem;
      }
      label {
        display: block;
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 0.35rem;
      }
      input {
        width: 100%;
        padding: 0.85rem 0.9rem;
        border-radius: 0.55rem;
        border: 1px solid var(--border);
        background: var(--field);
        color: var(--fg);
        font-size: 1rem;
        margin-bottom: 1rem;
      }
      button {
        width: 100%;
        padding: 0.95rem 1rem;
        border: 0;
        border-radius: 0.55rem;
        background: var(--accent);
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      button:active:not(:disabled) {
        filter: brightness(0.92);
      }
      .hint {
        margin-top: 1.25rem;
        font-size: 0.8rem;
        color: var(--muted);
        line-height: 1.4;
      }
      .err {
        color: #ff8e8e;
        font-size: 0.9rem;
        min-height: 1.25rem;
        margin: 0 0 0.75rem;
        white-space: pre-wrap;
      }
      .status {
        color: var(--muted);
        font-size: 0.9rem;
        min-height: 1.25rem;
        margin: 0 0 0.5rem;
      }
      code {
        font-size: 0.85em;
      }
    </style>
  </head>
  <body>
    <h1>crabmate</h1>
    <p class="lead">
      远程连接到已有的 <code>crabmate serve</code>（电脑 / 服务器）。工具与工作区在那台机器上执行；本机不运行 Agent 后端。
    </p>
    <form id="connect-form" method="post" action="#" autocomplete="on">
      <label for="url">服务器地址</label>
      <input
        id="url"
        name="username"
        type="url"
        inputmode="url"
        autocomplete="username"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="http://192.168.1.10:8080/"
        required
      />
      <label for="bearer">Web API 共享密钥（可选）</label>
      <input
        id="bearer"
        name="password"
        type="password"
        autocomplete="current-password"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="与 CM_WEB_API_BEARER_TOKEN 相同（不是模型 API_KEY）"
      />
      <p class="status" id="status" aria-live="polite"></p>
      <p class="err" id="err" aria-live="assertive"></p>
      <button type="submit" id="submit">连接</button>
    </form>
    <p class="hint">
      局域网常用明文 HTTP；公网请用 HTTPS + Bearer。成功连接后会记住服务器地址与共享密钥，下次启动自动登录；也可用系统密码管理器保存。连上后系统返回键可确认退出或回本页换服务器；也可右缘左划打开侧栏后点断开图标回到本页（不会自动重连）。
    </p>
    <script>
      const URL_KEY = "crabmate.mobile.serverUrl";
      const BEARER_KEY = "crabmate.mobile.webApiBearer";
      const form = document.getElementById("connect-form");
      const urlInput = document.getElementById("url");
      const bearerInput = document.getElementById("bearer");
      const err = document.getElementById("err");
      const statusEl = document.getElementById("status");
      const submitBtn = document.getElementById("submit");
      /** 防止自动登录与手动提交并发探测 */
      let connectInFlight = false;

      function wantsManualConnect() {
        try {
          return new URLSearchParams(location.search).get("manual") === "1";
        } catch (_) {
          return false;
        }
      }

      (function applySafeInsets() {
        function run() {
          try {
            const b = window.CrabMateMobile;
            if (!b || typeof b.getStatusBarInsetPx !== "function") return false;
            let top = Number(b.getStatusBarInsetPx());
            if (!Number.isFinite(top) || top < 0) top = 24;
            top = Math.max(top, 24);
            let bottom = 24;
            if (typeof b.getNavBarInsetPx === "function") {
              bottom = Number(b.getNavBarInsetPx());
              if (!Number.isFinite(bottom) || bottom < 0) bottom = 24;
              bottom = Math.max(bottom, 24);
            }
            const root = document.documentElement;
            root.style.setProperty("--cm-safe-top", top + "px");
            root.style.setProperty("--cm-safe-bottom", bottom + "px");
            root.setAttribute("data-cm-mobile-shell", "");
            return true;
          } catch (_) {
            return false;
          }
        }
        if (!run()) {
          [50, 200, 600].forEach(function (ms) {
            setTimeout(run, ms);
          });
        }
      })();

      try {
        const savedUrl = localStorage.getItem(URL_KEY);
        if (savedUrl) urlInput.value = savedUrl;
        const savedBearer = localStorage.getItem(BEARER_KEY);
        if (savedBearer) bearerInput.value = savedBearer;
      } catch (_) {}

      function setBusy(busy, msg) {
        submitBtn.disabled = !!busy;
        statusEl.textContent = msg || "";
      }

      function mobileBridge() {
        return window.CrabMateMobile || null;
      }

      function notifyAutofillSuccess() {
        try {
          const b = mobileBridge();
          if (b && typeof b.notifyLoginSuccess === "function") {
            b.notifyLoginSuccess();
          }
        } catch (_) {}
      }

      function notifyAutofillFailure() {
        try {
          const b = mobileBridge();
          if (b && typeof b.notifyLoginFailure === "function") {
            b.notifyLoginFailure();
          }
        } catch (_) {}
      }

      function invokeConnect(url, bearer) {
        const core = window.__TAURI__ && window.__TAURI__.core;
        if (!core || typeof core.invoke !== "function") {
          // 非 Tauri 环境：直接跳转（开发用）；仅非空 Bearer 写 hash
          const u = new URL(url);
          const b = (bearer || "").trim();
          if (b) {
            u.hash = "cm_web_api_bearer=" + encodeURIComponent(b);
          } else {
            u.hash = "";
          }
          window.location.href = u.href;
          return Promise.resolve();
        }
        return core.invoke("connect_remote", { url, bearer: bearer || "" });
      }

      function persistCredentials(href, bearer) {
        try {
          localStorage.setItem(URL_KEY, href);
          const b = (bearer || "").trim();
          if (b) {
            localStorage.setItem(BEARER_KEY, b);
          } else {
            localStorage.removeItem(BEARER_KEY);
          }
        } catch (_) {}
      }

      async function connectWithValues(rawUrl, bearer, opts) {
        if (connectInFlight) {
          return false;
        }
        const fromAuto = !!(opts && opts.fromAuto);
        err.textContent = "";
        let raw = (rawUrl || "").trim();
        if (!raw) {
          err.textContent = "请填写服务器地址";
          return false;
        }
        if (!/^https?:\/\//i.test(raw)) {
          raw = "http://" + raw;
        }
        let u;
        try {
          u = new URL(raw);
        } catch (_) {
          err.textContent = "地址无效";
          return false;
        }
        if (u.protocol !== "http:" && u.protocol !== "https:") {
          err.textContent = "仅支持 http/https";
          return false;
        }
        connectInFlight = true;
        persistCredentials(u.href, bearer);
        setBusy(true, fromAuto ? "已记住连接，正在自动登录…" : "正在探测服务器…");
        try {
          await invokeConnect(u.href, bearer);
          if (!fromAuto) {
            notifyAutofillSuccess();
          }
          setBusy(true, "已连接，正在打开界面…");
          return true;
        } catch (ex) {
          connectInFlight = false;
          if (!fromAuto) {
            notifyAutofillFailure();
          }
          const msg =
            typeof ex === "string"
              ? ex
              : ex && ex.message
                ? ex.message
                : String(ex);
          err.textContent = fromAuto
            ? "自动登录失败：" + msg + "\n请核对地址与共享密钥后重试。"
            : msg;
          setBusy(false, "");
          return false;
        }
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        await connectWithValues(urlInput.value, bearerInput.value, {
          fromAuto: false,
        });
      });

      // 冷启动：本地已有服务器地址则自动连接（断开回本页带 ?manual=1 时跳过）
      (function maybeAutoConnect() {
        if (wantsManualConnect()) {
          return;
        }
        let saved = "";
        try {
          saved = localStorage.getItem(URL_KEY) || "";
        } catch (_) {}
        if (!saved) {
          return;
        }
        const bearer = bearerInput.value || "";
        setTimeout(function () {
          connectWithValues(saved, bearer, { fromAuto: true });
        }, 80);
      })();
    </script>
  </body>
</html>
